name: Windows release candidate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
          architecture: x64
      - name: Build and test the portable candidate
        shell: pwsh
        run: .\scripts\build-windows.ps1 -PythonExecutable python -SmokeTest
      - name: Upload the Windows ZIP and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Compass-Windows-x64-release-candidate
          path: |
            dist/release/*.zip
            dist/release/*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
